name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Tests incl. ground-truth property test (race detector)
        run: go test -race -count=1 -coverprofile=cover.out ./...
      - name: Fuzz parsers (short)
        run: make fuzz FUZZTIME=15s
      - name: Demo, scored against ground truth
        run: make demo
      - name: Coverage summary
        run: go tool cover -func=cover.out | tail -1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  image:
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker build --build-arg VERSION=${{ github.sha }} -t recond:${{ github.sha }} .
